name: Zbuduj APK MKS Debica

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (bez wycofanego pakietu tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test spójności projektu i rozkładów
        run: node scripts/check-data.js && node scripts/check-project.js && node scripts/check-assets.js

      - name: Test parsera GPS (Java 17, bez SDK)
        run: |
          mkdir -p /tmp/mks-gps-xml-test
          javac -encoding UTF-8 -d /tmp/mks-gps-xml-test app/src/main/java/pl/debica/mks/app/GpsXml.java scripts/GpsXmlSmokeTest.java
          java -cp /tmp/mks-gps-xml-test pl.debica.mks.app.GpsXmlSmokeTest

      - name: Zbuduj APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Pobierz gotowe APK
        uses: actions/upload-artifact@v4
        with:
          name: MKS-Debica-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
