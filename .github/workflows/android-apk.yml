name: Zbuduj APK MKS Debica
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Weryfikacja rozkładów
        run: node scripts/check-data.js && node scripts/check-direct-mode.js && node --check app/src/main/assets/app.js
      - name: Kompilacja APK (debug)
        run: gradle --no-daemon :app:assembleDebug
      - name: Gotowe APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: MKS-Debica-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
